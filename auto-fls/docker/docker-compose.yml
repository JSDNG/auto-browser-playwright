version: '3.8'

services:
  auto-fls:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: auto-fls-server
    ports:
      - "5001:5001"
    environment:
      - HMA_API_BASE=http://host.docker.internal:2268
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5001
      - DEBUG=False
      - LOG_LEVEL=INFO
    volumes:
      - ../logs:/app/logs
      - ../.env:/app/.env:ro
    restart: unless-stopped
    networks:
      - auto-fls-network
    depends_on:
      - ngrok
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ngrok:
    image: ngrok/ngrok:latest
    container_name: auto-fls-ngrok
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro
    ports:
      - "4040:4040"  # ngrok web interface
    restart: unless-stopped
    networks:
      - auto-fls-network

  # Optional: Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: auto-fls-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - auto-fls-network

networks:
  auto-fls-network:
    driver: bridge

volumes:
  logs:
  prometheus_data:
