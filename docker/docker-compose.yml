version: "3.8"

services:
    playwright-automation:
        build:
            context: ..
            dockerfile: docker/Dockerfile
        container_name: playwright-automation
        environment:
            - HEADLESS=true
            - BROWSER_TIMEOUT=30000
            - PAGE_TIMEOUT=30000
            - LOG_LEVEL=INFO
            - BLOCKED_DOMAINS=localhost,127.0.0.1,0.0.0.0
        volumes:
            - ../logs:/home/playwright/logs
            - ../examples:/home/playwright/examples:ro
        stdin_open: true
        tty: true
        security_opt:
            - seccomp:unconfined
        shm_size: 1gb
        mem_limit: 2g
        cpus: "2.0"
        restart: unless-stopped

    # Optional: n8n service for integration testing
    n8n:
        image: n8nio/n8n:latest
        container_name: n8n
        environment:
            - N8N_HOST=localhost
            - N8N_PORT=5678
            - N8N_PROTOCOL=http
            - NODE_ENV=development
            - WEBHOOK_URL=http://localhost:5678/
            - GENERIC_TIMEZONE=UTC
        ports:
            - "5678:5678"
        volumes:
            - n8n_data:/home/node/.n8n
            - ../examples:/home/node/examples:ro
        depends_on:
            - playwright-automation
        restart: unless-stopped

volumes:
    n8n_data:
        driver: local

networks:
    default:
        name: playwright-network
